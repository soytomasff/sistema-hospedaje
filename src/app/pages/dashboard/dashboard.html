<div class="dashboard-container">

  <!-- TITULO -->
  <div class="dashboard-header">

    <h2>
      <img src="/login.jpg" class="titulo-icono" alt="logo">
      Sistema de Hotel
    </h2>

    <p class="subtitulo">
      Panel principal del sistema
    </p>

  </div>

  <!-- CARDS -->
  <div class="cards">

    <!-- HUESPEDES -->
    <div class="card">
      <div class="card-icon">
        <img src="/loghue.jpg" alt="Huéspedes">
      </div>

      <h3>Huéspedes</h3>
      <p>{{ totalHuespedes }}</p>
    </div>

    <!-- HABITACIONES -->
    <div class="card">
      <div class="card-icon">
        <img src="/loghabi.jpg" alt="Habitaciones">
      </div>

      <h3>Habitaciones</h3>
      <p>{{ totalHabitaciones }}</p>
    </div>

    <!-- PRODUCTOS -->
    <div class="card">
      <div class="card-icon">
        <img src="/logpro.jpg" alt="Productos">
      </div>

      <h3>Productos</h3>
      <p>{{ totalProductos }}</p>
    </div>

    <!-- HABITACIONES LIBRES -->
    <div class="card libre">
      <div class="card-icon">
        <img src="/loghabi.jpg" alt="Habitaciones libres">
      </div>

      <h3>Habitaciones<br>Libres</h3>
      <p>{{ habitacionesLibres }}</p>
    </div>

    <!-- HABITACIONES OCUPADAS -->
    <div class="card ocupada">
      <div class="card-icon">
        <img src="/loghabi.jpg" alt="Habitaciones ocupadas">
      </div>

      <h3>Habitaciones<br>Ocupadas</h3>
      <p>{{ habitacionesOcupadas }}</p>
    </div>

  </div>

</div>
